services:
  - type: web
    name: bridge1-executive-suite
    runtime: node
    plan: free
    rootDir: bridge1-executive-suite
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: BRIDGE1_VOICE
        value: marin
      - key: ALLOWED_ORIGINS
        value: https://thebotstores.com
      - key: REVIEW_TOKEN
        sync: false
      - key: BRIDGE1_ACTIVE
        value: false
      - key: RESEND_API_KEY
        sync: false
      - key: REVIEW_EMAIL
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: bridge1-postgres
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: 5
      - key: INVITE_REQUIRED
        value: true
      - key: INVITE_CODES_SHA256
        sync: false
      - key: SESSION_SIGNING_SECRET
        generateValue: true

databases:
  - name: bridge1-postgres
    databaseName: bridge1
    user: bridge1
    plan: free
