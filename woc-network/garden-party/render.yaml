services:
  - type: web
    name: woc-garden-party
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/melbgittinit/botbox-alpha-clean
    branch: woc-garden-party-alpha
    rootDir: woc-network/garden-party
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PUBLIC_WRITES_ENABLED
        value: 'false'
      - key: APP_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RATE_LIMIT_SECRET
        generateValue: true
