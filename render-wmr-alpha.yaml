services:
  - type: web
    name: wmr-plan-alpha
    runtime: node
    plan: free
    region: ohio
    branch: wmr-plan-alpha
    buildCommand: cd wmr-plan-service && npm install
    startCommand: cd wmr-plan-service && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_APP_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        value: distributorsofurbanspiritbiblesbooks-gifts.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: 2026-07
      - key: APP_PROXY_REQUIRED
        value: "true"
      - key: APP_PROXY_MAX_AGE_SECONDS
        value: "300"
      - key: WMR_BASE_VARIANT_ID
        value: gid://shopify/ProductVariant/52360538423589
      - key: WMR_FOR_REAL_VARIANT_ID
        value: gid://shopify/ProductVariant/53873614192933
      - key: BWF_PASSPORT_VARIANT_ID
        value: gid://shopify/ProductVariant/53873614520613
      - key: VIP_ME_VARIANT_ID
        value: gid://shopify/ProductVariant/53770826809637
